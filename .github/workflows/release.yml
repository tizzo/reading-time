name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one release may be in flight; a superseded build is abandoned rather
# than racing the newer one to publish.
concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The rolling release that always points at the tip of main.
  RELEASE_TAG: latest

jobs:
  # Gate: nothing is published unless the suite is green.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The aarch64 Linux target is the only one that is not either native to
      # its runner or covered by the host toolchain's linker.
      - name: Install cross linker
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="read-time-${{ matrix.target }}"
          mkdir -p "dist/$staging"
          cp "target/${{ matrix.target }}/release/read-time" "dist/$staging/"
          cp README.md "dist/$staging/"
          tar -czf "dist/$staging.tar.gz" -C dist "$staging"
          rm -rf "dist/$staging"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "read-time-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$staging" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/read-time.exe" "dist/$staging/"
          Copy-Item README.md "dist/$staging/"
          Compress-Archive -Path "dist/$staging" -DestinationPath "dist/$staging.zip"
          Remove-Item -Recurse -Force "dist/$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: read-time-${{ matrix.target }}
          path: dist/read-time-*.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum read-time-* > SHA256SUMS
          cat SHA256SUMS

      # Replacing the release outright keeps assets from a previous commit
      # from lingering alongside the current ones.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true

          notes="$(printf '%s\n' \
            "Rolling build of \`main\`, replaced on every push." \
            "" \
            "| | |" \
            "|---|---|" \
            "| Commit | [\`$(git rev-parse --short HEAD)\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" \
            "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |" \
            "" \
            "$(git log -1 --pretty=%s)" \
            "" \
            "Verify a download against \`SHA256SUMS\`.")"

          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Latest build of main" \
            --notes "$notes" \
            artifacts/*
